<style>

/* ============================================================
   TÓTEM 21K BUENOS AIRES — v1.1 · RUTA TRAZADA A MANO + MARKERS NATIVOS
   Mapa real de calles (tiles CARTO sobre OpenStreetMap).
   · Los carteles son tooltips HTML: se auto-dimensionan,
     imposible que el texto desborde el globo.
   · Los km se calculan por DISTANCIA REAL (haversine) sobre
     la traza: caen donde caen en la calle.
   · Tocás un hito → flyTo cinematográfico → popup circular.
   · Vertical u horizontal: el mapa se adapta solo, sin rotar.
   · Día/noche: cambia el juego de tiles (claro ↔ oscuro).
   Para el tótem OFFLINE: bajar los tiles de la zona y apuntar
   la URL a un servidor local (notas al final del archivo).
   ============================================================ */

:root{
  /* Marca 21K — modo día (board campaña) */
  --ba-negro:#1B2221;
  --ba-papel:#F3F2F1;
  --ba-naranja:#EF981F;
  --ba-azul:#183246;
  --ba-verde:#054D4B;
  --ba-fluo:#5E992E;
  --ba-heart-1:#F7C21C;
  --ba-heart-2:#E7671A;
  --ba-heart-3:#DD3466;
  --ba-gris:#5E605F;
  --ba-gris-claro:#989791;

  --fondo:var(--ba-papel);
  --header:var(--ba-papel);
  --tinta:var(--ba-azul);
  --tinta-suave:var(--ba-gris);
  --ruta:#F7C21C;
  --km:#183246;
  --km-num:#F7C21C;
  --hito:#FFFFFF;
  --marca:#EF981F;
  --acento:#EF981F;
  --hidra:var(--ba-verde);
  --tarjeta:#FFFFFF;
  --boton:#FFFFFF;
  --standby:var(--ba-papel);
  --sb-grad-1:#9b2677;
  --sb-grad-2:#c53737;
  --sb-grad-3:#dfa63f;
  --sb-texto:#ffffff;
  --sb-borde:#FFFFFF;
  --linea:rgba(24,50,70,.22);
  --sombra:0 12px 40px rgba(24,50,70,.18);
  --ani-dur:.9s;
  --ani-dur-flip:.9s;
  --ease-quart:cubic-bezier(.77,0,.175,1);
  --ease-quad:cubic-bezier(.455,.03,.515,.955);
  --pop-dur:.9s;
}
body.noche{
  --fondo:var(--ba-azul);
  --header:var(--ba-azul);
  --tinta:var(--ba-papel);
  --tinta-suave:var(--ba-gris-claro);
  --ruta:#F7C21C;
  --km:#F7C21C;
  --km-num:var(--ba-azul);
  --hito:#FFFFFF;
  --marca:var(--ba-fluo);
  --acento:var(--ba-fluo);
  --hidra:var(--ba-fluo);
  --tarjeta:var(--ba-verde);
  --boton:var(--ba-verde);
  --standby:var(--ba-azul);
  --sb-grad-1:#9b2677;
  --sb-grad-2:#c53737;
  --sb-grad-3:#dfa63f;
  --sb-texto:#ffffff;
  --sb-borde:#FFFFFF;
  --linea:rgba(243,242,241,.22);
  --sombra:0 12px 50px rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
img{-webkit-user-drag:none;}
html,body{
  width:100%;max-width:100%;
  height:100%;
  height:100svh;
  height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--fondo);color:var(--tinta);
  font-family:'Montserrat',sans-serif;
  transition:background .6s ease,color .6s ease;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
button:focus-visible{outline:3px dashed var(--acento);outline-offset:4px;}

#app{
  position:relative;
  height:100%;
  height:100svh;
  height:100dvh;
  display:flex;flex-direction:column;
  min-height:0;
}
#mapaWrap{flex:1;position:relative;overflow:hidden;min-height:0;min-width:0;}

header{
  padding:18px 28px 12px;z-index:20;position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:2px dashed var(--linea);background:var(--header, var(--fondo));
  color:var(--tinta);
  transition:background .6s ease,color .6s ease;
}
.titulo h1{
  font-family:'Montserrat',sans-serif;font-weight:900;
  font-size:clamp(22px,3.2vw,36px);line-height:1;text-transform:uppercase;
  color:var(--tinta);
}
.titulo h1 em{font-style:normal;color:var(--marca);}
.titulo .sub{
  font-family:'Montserrat',sans-serif;font-weight:600;
  font-size:clamp(16px,2vw,22px);color:var(--acento);
  display:inline-block;margin-top:2px;
}
.stats{
  text-align:right;font-size:clamp(10px,1.2vw,12px);
  color:var(--tinta-suave);line-height:1.7;white-space:nowrap;
}
.stats b{color:var(--tinta);font-weight:600;}

/* ---------- MAPA LEAFLET ---------- */
#mapaWrap{flex:1;position:relative;overflow:hidden;min-height:0;min-width:0;}
#mapa{position:absolute;inset:0;background:var(--fondo);}

/* mapa claro + degradé fusionado (multiply por defecto; editable en Colores) */
.maplibregl-canvas-container{
  filter:
    saturate(var(--map-sat, 2.5))
    hue-rotate(calc(var(--map-hue, 339) * 1deg))
    brightness(calc(var(--map-bri, 0.99) * (1 - var(--map-dark, 0.04) * 0.55)))
    contrast(var(--map-con, 1.08))
    blur(var(--map-blur, 0px));
  transition:filter .4s ease;
}
body.noche .maplibregl-canvas-container{
  filter:
    saturate(var(--map-sat, 2.5))
    hue-rotate(calc(var(--map-hue, 339) * 1deg))
    brightness(calc(var(--map-bri, 0.99) * (1 - var(--map-dark, 0.04) * 0.55)))
    contrast(var(--map-con, 1.08))
    blur(var(--map-blur, 0px));
}

.leaflet-tinte-pane{
  z-index:350;
  pointer-events:none;
  mix-blend-mode:var(--map-blend, multiply);
  isolation:auto;
  transition:filter .4s ease;
}
.leaflet-overlay-pane,
.leaflet-marker-pane,
.leaflet-shadow-pane{
  transition:filter .4s ease;
}
/* blur del mapa al abrir popup (el cartel queda nítido) */
#mapa.popup-blur{
  --map-blur:5px;
}

@media (prefers-reduced-motion: reduce){
  .maplibregl-canvas-container,
  .leaflet-tinte-pane,
  .leaflet-overlay-pane,
  .leaflet-marker-pane,
  .leaflet-shadow-pane{transition:none;}
  #mapa.popup-blur{--map-blur:2px;}
  
}
.mapa-tinte{
  position:absolute;
  left:0;top:0;
  pointer-events:none;
  background:linear-gradient(
    175deg,
    var(--map-grad-1, var(--sb-grad-1, #AE2087)) 0%,
    var(--map-grad-1, var(--sb-grad-1, #AE2087)) 8%,
    var(--map-grad-2, #EC1484) 28%,
    var(--map-grad-3, var(--sb-grad-2, #EC2630)) 50%,
    var(--map-grad-4, #F05C26) 72%,
    var(--map-grad-5, var(--sb-grad-3, #F8BA1B)) 92%,
    var(--map-grad-5, var(--sb-grad-3, #F8BA1B)) 100%
  );
  opacity:var(--map-tinte-op, 0.82);
}

/* la ruta y el flujo animado (Leaflet dibuja polylines como SVG) */
path.trazaRuta{
  stroke:var(--ruta);
  filter:drop-shadow(0 0.5px 1px rgba(0,0,0,.22));
}

/* ---------- MAPA MAPLIBRE ---------- */
#mapaWrap{flex:1;position:relative;overflow:hidden;min-height:0;min-width:0;}
#tiltStage{
  position:absolute;inset:0;z-index:1;
  perspective:1100px;
  perspective-origin:50% 55%;
  transform-style:preserve-3d;
  overflow:hidden;
  background:linear-gradient(
    175deg,
    var(--map-grad-1, #AE2087) 0%,
    var(--map-grad-1, #AE2087) 8%,
    var(--map-grad-2, #EC1484) 28%,
    var(--map-grad-3, #EC2630) 50%,
    var(--map-grad-4, #F05C26) 72%,
    var(--map-grad-5, #F8BA1B) 92%,
    var(--map-grad-5, #F8BA1B) 100%
  );
}
#tiltStage #mapa{
  position:absolute;inset:0;width:100%;height:100%;
  transform-origin:50% 50%;
  transform:translate3d(0,0,0) scale(1);
  background:var(--fondo);
}
#tiltStage .mapa-tinte-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  transform-origin:50% 50%;
}
/* bleed: tapa bordes al inclinar; todo el mapa (ruta, corazones, huellas) se mueve junto */
#mapaWrap.tilt-on #tiltStage #mapa,
#mapaWrap.tilt-on #tiltStage .mapa-tinte-overlay{
  inset:-42%;
  width:184%;
  height:184%;
  transform:
    translate3d(var(--tilt-x, 0px), var(--tilt-y, 0px), 0)
    rotateX(var(--tilt-rx, 0deg))
    rotateY(var(--tilt-ry, 0deg));
  will-change:transform;
}
/* con popup abierto: sin bleed 3D para que el cartel no se corte */
#mapaWrap.tilt-on.popup-abierto #tiltStage #mapa,
#mapaWrap.tilt-on.popup-abierto #tiltStage .mapa-tinte-overlay{
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  transform:none !important;
  will-change:auto;
}
#mapaWrap.popup-abierto #tiltStage{
  overflow:hidden;
}
/* popups más compactos si venís de inclinación */
body.tilt-activo .hito-pop-foto{
  max-height:min(14dvh, 110px) !important;
}
body.tilt-activo .hito-pop-body{
  max-height:min(20dvh, 150px) !important;
}
body.tilt-activo .maplibregl-popup.hito-popup .maplibregl-popup-content{
  max-height:min(62dvh, 62vh) !important;
}
@media (prefers-reduced-motion: reduce){
  #btnInclinar{display:none !important;}
  #mapaWrap.tilt-on #tiltStage #mapa,
  #mapaWrap.tilt-on #tiltStage .mapa-tinte-overlay{
    inset:0;width:100%;height:100%;
    transform:none;will-change:auto;
  }
}
.maplibregl-canvas-container, .maplibregl-canvas{outline:none;}
.maplibregl-ctrl-attrib{font-size:10px;}
.maplibregl-ctrl-bottom-right{
  right:max(6px, env(safe-area-inset-right, 0px));
  bottom:max(4px, env(safe-area-inset-bottom, 0px));
}
#btnInclinar.activo{outline:2px solid var(--marca,#EF981F);}
.toast-3d{
  position:absolute;left:50%;bottom:72px;transform:translateX(-50%);
  z-index:40;pointer-events:none;
  max-width:min(88vw, 360px);
  text-align:center;
  background:rgba(27,34,33,.88);color:#fff;font:600 12px/1.3 Archivo,sans-serif;
  padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .35s;
}
.toast-3d.visto{opacity:1;}
#mapa.dibujando .huellaIcono{opacity:0;}

/* huellas: pisadas que recorren el circuito en ola */
.huellaIcono{transition:opacity .5s ease;width:10px;height:14px;}
.huellaIcono svg{
  display:block;
  opacity:0;
  animation:pisada var(--ciclo,9s) linear infinite !important;
  animation-delay:var(--delay,0ms) !important;
}
.huellaIcono .suela{fill:var(--ruta);}
.huellaIcono .surcos{
  fill:none;stroke:rgba(255,255,255,.8);
  stroke-width:1.7;stroke-linecap:round;
}
@keyframes pisada{
  0%{opacity:0;}
  6%{opacity:.85;}
  42%{opacity:.85;}
  58%{opacity:0;}
  100%{opacity:0;}
}

/* marcadores de km (ref recorrido oficial) */
.km-wrap{
  width:34px;height:34px;
  pointer-events:none;
}
.kmIcono{
  width:34px;height:34px;border-radius:50%;
  background:var(--ruta, #F7C21C);color:#fff;
  display:grid;place-items:center;
  font-family:'Archivo',system-ui,sans-serif;
  font-weight:900;font-stretch:112%;font-size:15px;
  letter-spacing:-.02em;
  border:2.5px solid #111;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
  text-shadow:0 0 2px #000, 0 1px 2px #000;
  -webkit-text-stroke:0.55px #000;
  paint-order:stroke fill;
  opacity:0;transform:scale(.45);
  transition:opacity .4s ease, transform .4s cubic-bezier(.2,1.2,.3,1);
}
.kmIcono.visible{
  opacity:1;transform:scale(1);
}
/* durante el trazado: un poco más grandes */
#mapa.dibujando .km-wrap{
  width:42px;height:42px;
}
#mapa.dibujando .kmIcono{
  width:42px;height:42px;
  font-size:18px;
  font-weight:900;
  border:3px solid #111;
  box-shadow:0 3px 12px rgba(0,0,0,.5);
  text-shadow:0 0 2px #000, 0 1px 3px #000;
  -webkit-text-stroke:0.7px #000;
}
#mapa .maplibregl-marker:has(.kmIcono){
  z-index:6 !important;
}
.hidraIcono{
  width:20px;height:20px;border-radius:50%;
  background:var(--hidra);color:#fff;
  display:grid;place-items:center;font-size:11px;
  border:2px solid var(--fondo);
}

/* pin del hito — flat + 3D (hover/activo) + latido radar */
.leaflet-hitos-pane .leaflet-marker-icon,
.leaflet-marker-icon{overflow:visible !important;}
.pinIcono{
  position:relative;
  width:48px;height:48px;
  display:grid;place-items:center;
  cursor:pointer;
  overflow:visible;
}
.pin-grupo{
  /* NO position:relative acá: este nodo ES el .maplibregl-marker
     y MapLibre necesita position:absolute + top/left 0 para anclar al geo */
  width:48px;height:48px;
  overflow:visible;
  pointer-events:auto;
}
/* icono del lugar: sale del corazón hacia arriba */
.pin-info-fly{
  position:absolute;
  left:50%;top:50%;
  width:64px;height:64px;
  margin:0;
  transform:translate(-50%, -50%) scale(.12);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  z-index:6;
}
.pin-info{
  display:grid;place-items:center;
  position:relative;
  width:64px;height:64px;
  border-radius:50%;
  padding:0;margin:0;
  /* globito blanco con falso 3D */
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,1) 0%, rgba(255,255,255,.92) 28%, rgba(245,245,245,.98) 55%, rgba(220,222,224,1) 100%);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:
    inset 0 -6px 10px rgba(0,0,0,.12),
    inset 0 4px 8px rgba(255,255,255,.95),
    inset -3px -3px 6px rgba(0,0,0,.06),
    0 3px 8px rgba(0,0,0,.28),
    0 1px 2px rgba(0,0,0,.18);
  color:var(--ruta, #F7C21C);
  filter:none;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  transform:translateY(0);
  overflow:hidden;
}
.pin-info::before{
  content:"";
  position:absolute;
  left:16%;top:12%;
  width:38%;height:22%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 55%, transparent 72%);
  pointer-events:none;
  z-index:0;
}
.pin-info svg{
  width:44px;height:44px;
  display:block;
  overflow:visible;
  pointer-events:none;
  position:relative;
  z-index:1;
}
.pin-grupo.activo-sel .pin-info-fly{
  visibility:visible;
  pointer-events:auto;
  animation:pinInfoFlyOut .6s cubic-bezier(.2,1.2,.35,1) forwards;
}
.pin-grupo.activo-sel .pin-info-fly.rebote{
  opacity:1;
  visibility:visible;
  transform:translate(-50%, calc(-50% - 58px)) scale(1);
  animation:none;
}
.pin-grupo.activo-sel .pin-info-fly.rebote .pin-info{
  animation:pinInfoBounce 1.25s ease-in-out infinite;
}
.pin-grupo.activo-sel .pin-info:active{
  transform:scale(.9);
}
@keyframes pinInfoFlyOut{
  0%{
    opacity:0;
    visibility:visible;
    transform:translate(-50%, -50%) scale(.1);
  }
  72%{
    opacity:1;
    transform:translate(-50%, calc(-50% - 64px)) scale(1.08);
  }
  100%{
    opacity:1;
    visibility:visible;
    transform:translate(-50%, calc(-50% - 58px)) scale(1);
  }
}
@keyframes pinInfoBounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-4px); }
}
#mapa.popup-blur .pin-info-fly{
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
  animation:none !important;
}
.pin-flotante .pin-info-fly,
#pin-flotante-clone .pin-info-fly{display:none !important;}
@media (prefers-reduced-motion: reduce){
  .pin-grupo.activo-sel .pin-info-fly{
    animation:none;
    opacity:1;visibility:visible;
    transform:translate(-50%, calc(-50% - 58px)) scale(1);
  }
  .pin-grupo.activo-sel .pin-info-fly.rebote .pin-info{animation:none;}
}
.pinIcono .pin-flat{
  position:relative;z-index:2;
  width:32px;height:32px;
  transition:opacity .28s ease, transform .4s cubic-bezier(.34,1.3,.64,1);
  transform-origin:center;
  animation:pinRadarBeat 1.55s ease-in-out infinite;
  animation-delay:var(--delay, 0s);
}
.pinIcono .pin-flat .corazon{
  width:100%;height:100%;
  display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.28));
}
.pinIcono .pin-flat .corazon path{
  fill:var(--hito, #fff);
  stroke:var(--ruta, #F7C21C);
  stroke-width:1.2;
  stroke-linejoin:round;
  paint-order:stroke fill;
}
.pinIcono .pin-radar{
  position:absolute;left:50%;top:50%;
  width:14px;height:14px;margin:-7px 0 0 -7px;
  border:2px solid var(--ruta, #F7C21C);
  border-radius:50%;
  opacity:0;z-index:1;pointer-events:none;
  animation:pinRadarRing 1.55s ease-out infinite;
  animation-delay:var(--delay, 0s);
}
@keyframes pinRadarBeat{
  0%, 55%, 100%{transform:scale(1)}
  62%{transform:scale(1.32)}
  70%{transform:scale(1)}
  78%{transform:scale(1.22)}
  88%{transform:scale(1)}
}
@keyframes pinRadarRing{
  0%, 55%{transform:scale(1);opacity:0}
  60%{opacity:.6}
  100%{transform:scale(4.2);opacity:0}
}

/* corazón 3D (estilo corazon-3d.html) */
.pinIcono .pin-3d{
  position:absolute;left:50%;top:50%;
  z-index:3;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(.55) rotateY(-120deg);
  transform-origin:center;
  transition:opacity .2s ease, transform .2s ease;
  filter:drop-shadow(0 4px 8px rgba(255,60,20,.35));
}
.pinIcono .heart{
  --size:40px;
  width:var(--size);height:var(--size);
  position:relative;display:block;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/></svg>') center / contain no-repeat;
          mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/></svg>') center / contain no-repeat;
  background:
    radial-gradient(circle at 80% 85%, rgba(255,240,90,1) 0%, rgba(255,205,20,.7) 30%, transparent 58%),
    radial-gradient(circle at 22% 18%, rgba(255,80,120,.6) 0%, transparent 42%),
    linear-gradient(135deg, #f5063f 0%, #ff3617 38%, #ff8c00 70%, #ffcc00 100%);
}
.pinIcono .heart::before{
  content:"";
  position:absolute;top:9%;left:14%;
  width:42%;height:34%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,
    rgba(255,255,255,.95) 0%,
    rgba(255,255,255,.45) 45%,
    transparent 72%);
  filter:blur(calc(var(--size) * .02));
  transform:rotate(-18deg);
}
.pinIcono .heart::after{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 108%, rgba(255,255,220,.5) 0%, transparent 38%),
    radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(150,0,50,.35) 100%);
}

/* hover: aparece 3D con vueltita */
.pinIcono:hover .pin-flat,
.pinIcono.activo .pin-flat{
  opacity:0;
  transform:scale(.4) rotateY(90deg);
  animation:none;
}
.pinIcono:hover .pin-radar,
.pinIcono.activo .pin-radar{animation:none;opacity:0;}
.pinIcono:hover .pin-3d{
  opacity:1;
  animation:pinFlipIn .48s cubic-bezier(.22,1,.36,1) both;
}
.pinIcono.activo .pin-3d{
  opacity:1;
  animation:pinFlipIn .4s cubic-bezier(.22,1,.36,1) both, pinBeatActivo 1.6s ease-in-out .4s infinite;
}
.pinIcono.activo .heart{--size:48px;}
/* trazado: tip cerca → 3D con vueltita (sin cambiar tamaño) */
.pinIcono.trazado-3d .pin-flat{
  opacity:0;
  transform:rotateY(90deg);
  animation:none;
  transition:opacity .28s ease, transform .45s cubic-bezier(.22,1,.36,1);
}
.pinIcono.trazado-3d .pin-radar{animation:none;opacity:0;}
.pinIcono.trazado-3d .pin-3d{
  opacity:1;
  animation:pinFlipInTrazado .58s cubic-bezier(.22,1,.36,1) both;
}
/* fin del trazado: vuelta a blanco (mismo tamaño) */
.pinIcono.trazado-vuelta .pin-3d{
  animation:pinFlipOutTrazado .48s cubic-bezier(.22,1,.36,1) both !important;
}
.pinIcono.trazado-vuelta .pin-flat{
  opacity:1;
  transform:rotateY(0deg);
  animation:pinRadarBeat 1.55s ease-in-out infinite;
  transition:opacity .35s ease .12s, transform .48s cubic-bezier(.22,1,.36,1);
}
.pinIcono.trazado-vuelta .pin-radar{
  opacity:0;
  animation:pinRadarRing 1.55s ease-out infinite;
}
@keyframes pinFlipInTrazado{
  0%{opacity:0;transform:translate(-50%,-50%) rotateY(-160deg)}
  100%{opacity:1;transform:translate(-50%,-50%) rotateY(0deg)}
}
@keyframes pinFlipOutTrazado{
  0%{opacity:1;transform:translate(-50%,-50%) rotateY(0deg)}
  100%{opacity:0;transform:translate(-50%,-50%) rotateY(160deg)}
}
/* clon flotante: ya “llegó”; no reiniciar el flip (eso hacía el salto) */
.pin-flotante .pinIcono.activo .pin-flat{
  opacity:0;
  transform:scale(.4) rotateY(90deg);
  animation:none !important;
  transition:none !important;
}
.pin-flotante .pinIcono.activo .pin-3d{
  opacity:1;
  animation:pinBeatActivo 1.6s ease-in-out infinite !important;
  transform:translate(-50%,-50%) scale(1.18);
}
/* activo sin flip: transición suave al 3D (click → vuelo) */
.pinIcono.activo.activo-ya .pin-flat{
  opacity:0;
  transform:scale(.4) rotateY(90deg);
  animation:none !important;
  transition:opacity .18s ease, transform .18s ease;
}
.pinIcono.activo.activo-ya .pin-3d{
  opacity:1;
  animation:pinBeatActivo 1.6s ease-in-out .18s infinite !important;
  transform:translate(-50%,-50%) scale(1.18);
  transition:opacity .18s ease;
}
@keyframes pinFlipIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotateY(-160deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotateY(0deg)}
}
@keyframes pinBeatActivo{
  0%,100%{transform:translate(-50%,-50%) scale(1.18)}
  12%{transform:translate(-50%,-50%) scale(1.28)}
  24%{transform:translate(-50%,-50%) scale(1.18)}
  36%{transform:translate(-50%,-50%) scale(1.25)}
  48%{transform:translate(-50%,-50%) scale(1.18)}
}
@media (prefers-reduced-motion: reduce){
  .pinIcono .pin-flat,
  .pinIcono .pin-radar{animation:none !important;}
  .pinIcono:hover .pin-3d,
  .pinIcono.activo .pin-3d,
  .pinIcono.trazado-3d .pin-3d{animation:none !important;opacity:1;transform:translate(-50%,-50%) scale(1);}
  .pinIcono.activo .pin-3d{transform:translate(-50%,-50%) scale(1.18);}
  .pinIcono.trazado-3d .pin-3d{transform:translate(-50%,-50%);}
  .pinIcono.trazado-vuelta .pin-3d{animation:none !important;opacity:0;}
}

/* ---------- ATTRACT / STAND-BY (corazon + BA blanco + frase) ---------- */
#attract{
  position:absolute;inset:0;z-index:1100;
  display:grid;place-items:center;
  text-align:center;
  padding:max(4vmin, env(safe-area-inset-top, 0px)) 4vmin max(5vmin, env(safe-area-inset-bottom, 0px));
  overflow:hidden;
  opacity:1;transition:opacity .55s ease, background .4s ease;
  background:
    radial-gradient(circle at 80% 90%, color-mix(in srgb, var(--sb-grad-3, #dfa63f) 85%, transparent) 0%, transparent 55%),
    radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--sb-grad-1, #9b2677) 75%, transparent) 0%, transparent 50%),
    linear-gradient(135deg, var(--sb-grad-1, #9b2677) 0%, var(--sb-grad-2, #c53737) 38%, var(--sb-grad-3, #dfa63f) 100%);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--sb-texto, #ffffff);
}
#attract.oculto{
  opacity:0;
  pointer-events:none;
  /* congelar contenido: evita flash del logo mientras se desvanece */
  visibility:hidden;
  transition:opacity .55s ease, visibility 0s linear .55s;
}
#attract:not(.oculto){
  visibility:visible;
  transition:opacity .55s ease, visibility 0s linear 0s, background .4s ease;
}
#attract .screen{
  position:relative;
  width:min(96vw, 1100px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px, 3.2vmin, 28px);
  text-align:center;
  padding:2vmin 0;
  overflow:visible;
}
#attract .intro-logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(10px, 2.2vmin, 20px);
  transition:opacity .55s ease, transform .55s cubic-bezier(.22,1,.36,1);
  will-change:opacity, transform;
}
#attract .lockup{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(6px, 1.4vmin, 16px);
  font-size:clamp(4rem, 18vmin, 11rem);
  filter:drop-shadow(0 .04em .12em rgba(0, 20, 40, .28));
}
#attract .sb-heart{
  display:block;
  width:clamp(72px, 18vmin, 168px);
  height:auto;
  animation:sb-latido 1.4s ease-out infinite;
  transform-origin:center;
  filter:drop-shadow(0 .06em .14em rgba(255,60,20,.28));
  user-select:none;
  pointer-events:none;
}
/* BA como imagen del banner (no tipografía) */
#attract .wordmark,
#attract img.sb-ba{
  display:block;
  height:clamp(56px, 14vmin, 132px);
  width:auto;
  max-width:min(46vw, 280px);
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  filter:drop-shadow(0 .04em .12em rgba(0,20,40,.22));
}
/* frase: Inter Bold, en blanco */
#attract .subline{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  font-weight:700;
  font-size:clamp(1.05rem, 3.6vmin, 2rem);
  letter-spacing:-0.01em;
  line-height:1.25;
  color:var(--sb-texto, #ffffff);
  text-align:center;
  white-space:normal;
  max-width:min(92vw, 34rem);
  padding:0 12px;
  text-shadow:0 2px 12px rgba(0,20,40,.28);
  box-sizing:border-box;
}
#attract .subline .re{
  font-style:italic;
  font-weight:700;
  letter-spacing:.02em;
  padding:0 .05em;
}
#attract .tagline{display:none !important;}
#attract.fase-logo .intro-logo{opacity:1;transform:scale(1);}
#attract .cta{display:none;}
@keyframes sb-latido{
  0%   { transform:scale(1); }
  8%   { transform:scale(1.12); }
  16%  { transform:scale(.98); }
  24%  { transform:scale(1.08); }
  36%  { transform:scale(1); }
  100% { transform:scale(1); }
}
@keyframes sb-pulso{
  0%, 100% { opacity:.95; }
  50%      { opacity:.55; }
}
@media (prefers-reduced-motion: reduce){
  #attract .sb-heart{animation:none;}
  #attract .intro-logo{transition-duration:.01ms !important;}
}

#demoBar{display:none;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------- geodesia (igual que v14) ---------- */
const R_TIERRA = 6371000;
function haversine(a, b){
  const rad = x => x * Math.PI / 180;
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R_TIERRA * Math.asin(Math.sqrt(s));
}
let ACUM = [0], LARGO_TOTAL = 0;
function recalcularDistancias(){
  ACUM = [0];
  for(let i = 1; i < RUTA_GEO.length; i++){
    ACUM.push(ACUM[i-1] + haversine(RUTA_GEO[i-1], RUTA_GEO[i]));
  }
  LARGO_TOTAL = ACUM[ACUM.length-1];
}
recalcularDistancias();
function puntoEn(metros){
  const m = Math.max(0, Math.min(LARGO_TOTAL - 0.1, metros));
  let i = 1;
  while(ACUM[i] < m) i++;
  const t = (m - ACUM[i-1]) / (ACUM[i] - ACUM[i-1] || 1);
  const a = RUTA_GEO[i-1], b = RUTA_GEO[i];
  const lat = a[0] + (b[0]-a[0])*t, lng = a[1] + (b[1]-a[1])*t;
  const rumbo = Math.atan2(
    (b[1]-a[1]) * Math.cos(a[0]*Math.PI/180),
    (b[0]-a[0])
  ) * 180 / Math.PI;
  return {latlng:[lat,lng], rumbo};
}
/* proyecta un punto [lat,lng] sobre el segmento más cercano de RUTA_GPS */
function proyectarEnSegmento(p, a, b){
  const lat0 = a[0] * Math.PI / 180;
  const x = (p[1] - a[1]) * Math.cos(lat0);
  const y = (p[0] - a[0]);
  const dx = (b[1] - a[1]) * Math.cos(lat0);
  const dy = (b[0] - a[0]);
  const len2 = dx*dx + dy*dy;
  if(len2 < 1e-18) return { latlng:[a[0], a[1]], t:0 };
  const t = Math.max(0, Math.min(1, (x*dx + y*dy) / len2));
  return {
    latlng: [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t],
    t
  };
}
function snapARuta(latlng){
  let best = { latlng: RUTA_GEO[0], dist: Infinity, metros: 0 };
  for(let i = 1; i < RUTA_GEO.length; i++){
    const proj = proyectarEnSegmento(latlng, RUTA_GEO[i-1], RUTA_GEO[i]);
    const d = haversine(latlng, proj.latlng);
    if(d < best.dist){
      best = {
        latlng: proj.latlng,
        dist: d,
        metros: ACUM[i-1] + proj.t * (ACUM[i] - ACUM[i-1])
      };
    }
  }
  return best;
}

function padMapa(){
  const w = window.innerWidth || 800;
  const h = window.innerHeight || 600;
  /* móvil: menos padding → arranca un poco más cerca / con más zoom */
  if(w < 420) return { top: 40, bottom: Math.max(52, Math.round(h * 0.05)), left: 12, right: 44 };
  if(w < 768) return { top: 44, bottom: Math.max(56, Math.round(h * 0.05)), left: 14, right: 48 };
  if(w < 1100) return { top: 48, bottom: 56, left: 40, right: 72 };
  return { top: 56, bottom: 64, left: 56, right: 84 };
}
/* al saltar: más aire alrededor → zoom out y recorrido centrado */
function padMapaOverview(){
  const w = window.innerWidth || 800;
  const h = window.innerHeight || 600;
  if(w < 420){
    return {
      top: Math.round(h * 0.14),
      bottom: Math.round(h * 0.16),
      left: Math.round(w * 0.1),
      right: Math.round(w * 0.1)
    };
  }
  if(w < 768){
    return {
      top: Math.round(h * 0.13),
      bottom: Math.round(h * 0.15),
      left: Math.round(w * 0.09),
      right: Math.round(w * 0.09)
    };
  }
  return {
    top: Math.round(h * 0.12),
    bottom: Math.round(h * 0.12),
    left: Math.round(w * 0.14),
    right: Math.round(w * 0.14)
  };
}
function boundsRutaLngLat(){
  let minLng=Infinity, minLat=Infinity, maxLng=-Infinity, maxLat=-Infinity;
  for(const [lat,lng] of RUTA_GPS){
    if(lng<minLng) minLng=lng; if(lng>maxLng) maxLng=lng;
    if(lat<minLat) minLat=lat; if(lat>maxLat) maxLat=lat;
  }
  return [[minLng, minLat], [maxLng, maxLat]];
}
function padBounds(b, f){
  const [[a,c],[d,e]] = b;
  const w = d-a, h = e-c;
  return [[a - w*f, c - h*f], [d + w*f, e + h*f]];
}

function primerSymbolLayerId(){
  const layers = map.getStyle().layers || [];
  const s = layers.find(l => l.type === "symbol");
  return s ? s.id : undefined;
}
function aplanarEstiloLiberty(){
  const layers = map.getStyle().layers || [];
  for(const layer of layers){
    const id = layer.id;
    const t = layer.type;
    try{
      if(t === "background"){
        map.setPaintProperty(id, "background-color", "#F3F2F1");
      }
      if(id.includes("water") && t === "fill"){
        map.setPaintProperty(id, "fill-color", "#c8d7e0");
      }
      if((id.includes("park") || id.includes("landcover") || id.includes("landuse")) && t === "fill"){
        map.setPaintProperty(id, "fill-color", "#e8ebe4");
        map.setPaintProperty(id, "fill-opacity", 0.55);
      }
      if(t === "line" && (id.includes("road") || id.includes("street") || id.includes("path") || id.includes("bridge") || id.includes("tunnel"))){
        if(map.getPaintProperty(id, "line-color") != null){
          map.setPaintProperty(id, "line-color", "#ffffff");
        }
      }
      if(t === "fill" && id.includes("building")){
        map.setPaintProperty(id, "fill-opacity", 0);
        map.setPaintProperty(id, "fill-color", "#e6e4de");
      }
      if(t === "symbol"){
        const sl = layer["source-layer"] || "";
        if(id === "huellas"){ /* capa propia */ }
        /* POIs + por defecto sin textos: barrios, ciudad, agua, calles, etc. */
        else if(
          sl === "poi" || /^poi[_-]/i.test(id) || id === "airport" ||
          sl === "place" || sl === "transportation_name" || sl === "water_name" ||
          sl === "waterway" || sl === "housenumber" || sl === "park" || sl === "mountain_peak" ||
          /place_|highway-name|highway-shield|road_shield|water.?name|housenumber|park.?label/i.test(id)
        ){
          try{ map.setLayoutProperty(id, "visibility", "none"); }catch(_){}
        }else if(layer.layout && layer.layout["text-field"] != null){
          try{ map.setLayoutProperty(id, "visibility", "none"); }catch(_){}
        }
      }
    }catch(_){}
  }
}

    "source-layer": "building",

      "fill-extrusion-opacity": 0,
      "fill-extrusion-vertical-gradient": true
    }

  try{

    else map.addLayer(layer);
    extrudeReady = true;
    actualizarExtrusion();
    asegurarOrdenCapasRecorrido();

function aplicarMapaBaseLook(){
  if(!map) return;
  const look = modoMapaLook();
  const foto = look === "natural" || look === "satellite";
  let style;
  try{ style = map.getStyle(); }catch(_){ return; }
  if(!style || !style.layers) return;

  const setTilesSiHay = (sourceId, url)=>{
    const src = map.getSource(sourceId);

  /* fallback raster puro (capa "carto") */
  if(map.getLayer("carto") || map.getSource("carto")){
    setTilesSiHay("carto", urlParaMapLook(look));
    return;
  }
  /* respaldo raster encima del vector */
  if(map.getLayer("carto-raster-layer") || map.getSource("carto-raster")){
    setTilesSiHay("carto-raster", urlParaMapLook(look));
    try{ map.setLayoutProperty("carto-raster-layer", "visibility", "visible"); }catch(_){}
    return;
  }

  /* capa foto compartida (Voyager o satélite) */
  const fotoUrl = urlParaMapLook(look);
  const fotoAttr = atribucionParaMapLook(look);
  if(foto){
    if(!map.getSource("basemap-foto")){
      try{
        map.addSource("basemap-foto", {
          type: "raster",
          tiles: [fotoUrl],
          tileSize: 256,
          attribution: fotoAttr
        });
      }catch(e){ console.warn(e); }
    }else{
      setTilesSiHay("basemap-foto", fotoUrl);
    }
    if(!map.getLayer("basemap-foto-layer") && map.getSource("basemap-foto")){
      const bottom = (style.layers[0] && style.layers[0].id) || undefined;
      try{
        map.addLayer({
          id: "basemap-foto-layer",
          type: "raster",
          source: "basemap-foto"
        }, bottom);
      }catch(e){ console.warn(e); }
    }
    try{ map.setLayoutProperty("basemap-foto-layer", "visibility", "visible"); }catch(_){}
    if(map.getLayer("basemap-natural-layer")){
      try{ map.setLayoutProperty("basemap-natural-layer", "visibility", "none"); }catch(_){}
    }
    /* refrescar style tras addLayer */
    try{ style = map.getStyle(); }catch(_){}
    for(const layer of (style.layers || [])){
      const id = layer.id;
      if(CAPAS_MAPA_PROPIAS[id]) continue;
      if(layer.type === "symbol") continue;
      if(layer.type === "raster") continue;
      try{ map.setLayoutProperty(id, "visibility", "none"); }catch(_){}
    }
  }else{
    if(map.getLayer("basemap-foto-layer")){
      try{ map.setLayoutProperty("basemap-foto-layer", "visibility", "none"); }catch(_){}
    }
    if(map.getLayer("basemap-natural-layer")){
      try{ map.setLayoutProperty("basemap-natural-layer", "visibility", "none"); }catch(_){}
    }
    for(const layer of style.layers){
      const id = layer.id;
      if(CAPAS_MAPA_PROPIAS[id]) continue;
      if(layer.type === "symbol") continue;
      if(layer.type === "raster") continue;
      try{ map.setLayoutProperty(id, "visibility", "visible"); }catch(_){}
    }
    try{ aplanarEstiloLiberty(); }catch(_){}
  }
}

function metrosHastaPunto(idx){
  if(!ACUM.length) return 0;
  const i = Math.max(0, Math.min(idx, ACUM.length - 1));
  return ACUM[i];
}
/* polyline hasta `metros` sobre la ruta (velocidad constante en distancia) */
function coordsHastaMetros(metros){
  if(!LARGO_TOTAL || LARGO_TOTAL < 1) recalcularDistancias();
  const m = Math.max(0, Math.min(LARGO_TOTAL, metros));
  const coords = [RUTA_LNGLAT[0]];
  let i = 1;
  while(i < ACUM.length && ACUM[i] <= m + 1e-6){
    coords.push(RUTA_LNGLAT[i]);
    i++;
  }
  if(m < LARGO_TOTAL - 0.05 && i < RUTA_GEO.length){
    const {latlng} = puntoEn(m);
    const ll = aLngLat(latlng);
    const last = coords[coords.length - 1];
    if(!last || last[0] !== ll[0] || last[1] !== ll[1]) coords.push(ll);
  }
  if(coords.length < 2){
    coords.push(RUTA_LNGLAT[Math.min(1, RUTA_LNGLAT.length - 1)]);
  }
  return coords;
}

function bearingEntreLatLng(a, b){
  /* a,b = [lat,lng] → rumbo geodésico approx. en grados MapLibre */
  const lat0 = a[0] * Math.PI / 180;
  return Math.atan2(
    (b[1] - a[1]) * Math.cos(lat0),
    (b[0] - a[0])
  ) * 180 / Math.PI;
}
function lerpBearing(from, to, t){
  const d = ((to - from + 540) % 360) - 180;
  return from + d * t;
}
let _trazadoBearing = 0;
let _trazadoCenter = null;
let _trazadoCamListo = false;
function lerpLngLat(a, b, t){
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
/* misma pose para intro y seguimiento — evita el “salto” entre flip y trazo */
function cfgTrazadoCam(){
  const w = window.innerWidth || 800;
  const h = window.innerHeight || 600;
  const mobile = w < 768 || h < 500 || (typeof esMobileTilt === "function" && esMobileTilt());
  if(mobile){
    return {
      zoom: Math.min(CFG.trazadoZoom || 16.05, w < 420 ? 15.15 : 15.45),
      pitch: Math.min(CFG.trazadoPitch || 60, h < 500 ? 38 : 48),
      look: Math.min(CFG.trazadoLookAheadM || 220, w < 420 ? 110 : 140),
      offsetY: Math.min(CFG.trazadoCamOffsetY || 90, h < 500 ? 36 : 52)
    };
  }
  return {
    zoom: CFG.trazadoZoom || 16.05,
    pitch: CFG.trazadoPitch || 60,
    look: CFG.trazadoLookAheadM || 220,
    offsetY: CFG.trazadoCamOffsetY || 90
  };
}
function poseCamaraTrazado(metros){
  const tip = puntoEn(metros);
  const camCfg = cfgTrazadoCam();
  const look = camCfg.look;
  const camM = Math.min(LARGO_TOTAL - 0.1, metros + look);
  const camPt = puntoEn(camM);
  const backM = Math.max(0, metros - 90);
  const back = puntoEn(backM);
  const rumboA = bearingEntreLatLng(camPt.latlng, tip.latlng);
  const rumboB = bearingEntreLatLng(camPt.latlng, back.latlng);
  /* mix fijo (como antes): directo; la suavidad va en el lerp de seguimiento */
  return {
    center: aLngLat(camPt.latlng),
    bearing: lerpBearing(rumboA, rumboB, 0.48),
    zoom: camCfg.zoom,
    pitch: respaldoRaster ? 0 : camCfg.pitch,
    offsetY: camCfg.offsetY
  };
}
function jumpPoseTrazado(pose){
  if(!map || !pose) return;
  try{
    map.jumpTo({
      center: pose.center,
      zoom: pose.zoom,
      pitch: pose.pitch,
      bearing: pose.bearing,
      offset: [0, pose.offsetY]
    });
  }catch(_){}
  try{ actualizarExtrusion(); }catch(_){}
}
function camaraSeguirTrazado(metros, {instant} = {}){
  if(!map) return;
  const pose = poseCamaraTrazado(metros);
  const suave = (typeof cfgCamaraSuavidad === "function")
    ? cfgCamaraSuavidad()
    : { bearingLerp: 0.028, centerLerp: 0.038 };
  if(!_trazadoCamListo || instant){
    _trazadoBearing = pose.bearing;
    _trazadoCenter = pose.center.slice();
    _trazadoCamListo = true;
  }else{
    _trazadoBearing = lerpBearing(_trazadoBearing, pose.bearing, suave.bearingLerp);
    _trazadoCenter = lerpLngLat(_trazadoCenter, pose.center, suave.centerLerp);
  }
  jumpPoseTrazado({
    center: _trazadoCenter,
    bearing: _trazadoBearing,
    zoom: pose.zoom,
    pitch: pose.pitch,
    offsetY: pose.offsetY
  });
}

/* zoom out continuo desde la cámara actual (fin o saltar) */
function zoomOutSuaveAlSaltar(){
  if(!map) return;
  const w = window.innerWidth || 800;
  const maxZoom = w < 768 ? 14.05 : 13.45;
  const padding = padMapaOverview();
  let zNow = 16, pitchNow = 50, bearingNow = 0, centerNow = null;
  try{
    zNow = map.getZoom();
    pitchNow = map.getPitch();
    bearingNow = map.getBearing();
    centerNow = map.getCenter();
  }catch(_){}
  try{ map.stop(); }catch(_){}
  /* 1) bajar pitch + empezar a alejar, sin cambiar mucho el centro */
  const zPaso = Math.max(maxZoom + 0.85, zNow - 1.35);
  try{
    map.easeTo({
      center: centerNow || undefined,
      zoom: Math.min(zNow, zPaso),
      pitch: Math.max(0, pitchNow * 0.28),
      bearing: bearingNow * 0.35,
      offset: [0, 0],
      duration: 780,
      essential: true,
      easing: t => 1 - Math.pow(1 - t, 2.2)
    });
  }catch(_){}
  /* 2) encuadre final centrado, más lento */
  setTimeout(()=>{
    if(!map) return;
    try{
      map.fitBounds(BOUNDS_RUTA, {
        padding,
        maxZoom,
        pitch: 0,
        bearing: 0,
        duration: 1550,
        essential: true,
        offset: [0, 0]
      });
    }catch(_){
      try{ encuadrar(true); }catch(__){}
    }
    setTimeout(()=>{ try{ actualizarExtrusion(); }catch(_){} }, 500);
  }, 760);
}

/* intro: misma vía que el recorrido (jumpTo interpolado) — sin easeTo/stop/jump correctivo */
function camaraIntroRecorrido(){
  if(!map) return Promise.resolve();
  try{ map.stop(); }catch(_){}
  const target = poseCamaraTrazado(0);
  const dur = Math.max(400, Math.round(CFG.trazadoIntroZoomMs || 1400));
  const c = map.getCenter();
  const from = {
    center: [c.lng, c.lat],
    bearing: map.getBearing(),
    pitch: map.getPitch(),
    zoom: map.getZoom(),
    offsetY: 0
  };
  return new Promise(resolve=>{
    const t0 = performance.now();
    function frame(now){
      if(!trazadoActivo){ resolve(); return; }
      const u = Math.min(1, (now - t0) / dur);
      const e = u * u * (3 - 2 * u);
      jumpPoseTrazado({
        center: lerpLngLat(from.center, target.center, e),
        bearing: lerpBearing(from.bearing, target.bearing, e),
        pitch: from.pitch + (target.pitch - from.pitch) * e,
        zoom: from.zoom + (target.zoom - from.zoom) * e,
        offsetY: from.offsetY + (target.offsetY - from.offsetY) * e
      });
      if(u < 1){
        requestAnimationFrame(frame);
        return;
      }
      _trazadoBearing = target.bearing;
      _trazadoCenter = target.center.slice();
      _trazadoCamListo = true;
      jumpPoseTrazado(target);
      resolve();
    }
    requestAnimationFrame(frame);
  });
}
async function animarTrazado(){

  if(RUTA_LNGLAT.length < 2) return;
  if(!LARGO_TOTAL || LARGO_TOTAL < 1) recalcularDistancias();
  if(trazadoRaf){ cancelAnimationFrame(trazadoRaf); trazadoRaf = 0; }
  trazadoActivo = true;

  _trazadoCenter = null;
  try{ clearTimeout(S.tInactividad); }catch(_){}
  const mapaEl = document.getElementById("mapa");
  if(mapaEl) mapaEl.classList.add("dibujando");
  limpiarHuellas();
  limpiarCorazonesTrazado();
  cacheHitosTrazadoGeo();
  asegurarKms();
  ocultarKms();
  mostrarBtnSaltarTrazado(true);
  const dur = (typeof duracionTrazadoMs === "function") ? duracionTrazadoMs() : (CFG.trazadoMs || 52000);
  const introTotal = (CFG.trazadoIntroZoomMs || 1400) + (CFG.trazadoIntroCorazonMs || 900);
  tilt.inputLockHasta = performance.now() + dur + introTotal + 2500;
  if(tilt.on){
    tilt.paused = true;

  }

  setRutaVisibleTrazado(false);
  if(typeof setEtiquetasCallesTrazado === "function") setEtiquetasCallesTrazado(true);
  /* sin huellas en el trazado */
  if(!trazadoActivo) return;

  await camaraIntroRecorrido();

  await esperarMs(CFG.trazadoIntroCorazonMs || 900);
  if(!trazadoActivo) return;
  setRutaVisibleTrazado(true);
  asegurarOrdenCapasRecorrido();
  map.getSource("ruta").setData({
    type: "Feature",
    geometry: { type: "LineString", coordinates: coordsHastaMetros(0) }
  });
  const t0 = performance.now();
  function frame(now){
    if(!trazadoActivo) return;
    const u = Math.min(1, (now - t0) / dur);
    const metros = u * LARGO_TOTAL;
    map.getSource("ruta").setData({
      type: "Feature",
      geometry: { type: "LineString", coordinates: coordsHastaMetros(metros) }
    });
    revelarKmsHasta(metros);
    revelarCorazones3dCerca(metros);
    camaraSeguirTrazado(metros);
    if(u < 1){
      trazadoRaf = requestAnimationFrame(frame);
    }else{
      terminarTrazado();
    }
  }
  trazadoRaf = requestAnimationFrame(frame);
}

function popupHtml(h){
  const dir = h.dir ? `<p class="hito-pop-dir">${h.dir}</p>` : "";
  const foto = h.foto
    ? `<img class="hito-pop-foto" src="${h.foto}" alt="" loading="lazy" decoding="async">`
    : "";
  const txt = (h.texto || "").trim();
  const body = txt ? `<p>${txt}</p>` : "";
  return `<div class="hito-pop">
    <h3 class="hito-pop-title">${h.nombre}</h3>
    ${dir}
    ${foto}
    <div class="hito-pop-body">${body}</div>
  </div>`;
}
function setPopupBlur(on){
  const el = document.getElementById("mapa");
  if(el) el.classList.toggle("popup-blur", !!on);
  const wrap = document.getElementById("mapaWrap");
  if(wrap) wrap.classList.toggle("popup-abierto", !!on);
  const canvas = el?.querySelector?.(".maplibregl-canvas");
  if(canvas){
    canvas.style.filter = on ? "blur(5px)" : "";
    canvas.style.transition = "filter .35s ease";
  }
  pausarTiltPorPopup(!!on);
  if(!on) soltarPinFlotante();
  /* al sacar el bleed 3D hay que resize: si no, el popup queda mal/cortado */
  if(map){
    requestAnimationFrame(()=>{
      try{ map.resize(); }catch(_){}
      if(on){
        requestAnimationFrame(()=> ajustarPopupAlViewport());
        setTimeout(()=> ajustarPopupAlViewport(), 120);
        setTimeout(()=> ajustarPopupAlViewport(), 420);
      }
    });
  }
}
function soltarPinFlotante(){
  const clone = document.getElementById("pin-flotante-clone");
  if(clone){
    if(clone._syncFlotante && map){
      try{ map.off("move", clone._syncFlotante); map.off("zoom", clone._syncFlotante); map.off("resize", clone._syncFlotante); }catch(_){}
    }
    clone.remove();
  }
  /* restaurar TODOS los pines (no solo .pin-activo-wrap: marcarActivo ya puede haber quitado la clase) */
  Object.values(marcadores || {}).forEach(m=>{
    try{
      const root = m.getElement();
      if(!root) return;
      root.style.visibility = "";
      root.classList.remove("pin-activo-wrap");
    }catch(_){}
  });
}
function anclarPinActivoFueraDelBlur(h){
  /* clon del corazón fuera de #mapa; misma proyección que MapLibre (sin salto) */
  if(document.getElementById("pin-flotante-clone")?.dataset?.hid === h.id){
    const c = document.getElementById("pin-flotante-clone");
    if(c && c._syncFlotante) c._syncFlotante();
    return;
  }
  soltarPinFlotante();
  const wrap = document.getElementById("mapaWrap");
  const m = h && marcadores[h.id];
  if(!wrap || !m || !map) return;
  const root = m.getElement();
  if(!root) return;
  root.classList.add("pin-activo-wrap");

  const clone = root.cloneNode(true);
  clone.id = "pin-flotante-clone";
  clone.dataset.hid = h.id;
  clone.classList.add("pin-activo-wrap", "pin-flotante");
  clone.style.cssText = "position:absolute;width:36px;height:36px;visibility:visible;filter:none;opacity:1;z-index:45;pointer-events:none;margin:0;";
  const pinClon = clone.querySelector(".pinIcono");
  if(pinClon){
    pinClon.classList.add("activo", "activo-ya");
  }
  clone.querySelectorAll("[id]").forEach(n=>{ if(n !== clone) n.removeAttribute("id"); });
  wrap.appendChild(clone);

  const sync = ()=>{
    const el = document.getElementById("pin-flotante-clone");
    if(!map || !el) return;
    const ll = aLngLat(geoHito(h));
    const p = map.project(ll);
    const wr = wrap.getBoundingClientRect();
    const mr = document.getElementById("mapa").getBoundingClientRect();
    el.style.left = (mr.left - wr.left + p.x) + "px";
    el.style.top = (mr.top - wr.top + p.y) + "px";
    el.style.transform = "translate(-50%, -50%)";
  };
  clone._syncFlotante = sync;
  sync(); /* alinear con el geo antes de ocultar el original */
  root.style.visibility = "hidden";
  map.on("move", sync);
  map.on("zoom", sync);
  map.on("resize", sync);
}

function ajustarPopupFijo(){
  const layer = document.getElementById("hitoFixedPop");
  if(!layer || layer.hidden) return;
  const card = layer.querySelector(".hito-fixed-card");
  const body = layer.querySelector(".hito-pop-body");
  const foto = layer.querySelector(".hito-pop-foto");
  const vh = window.visualViewport?.height || window.innerHeight || 800;
  const avail = Math.max(160, vh - 28);
  const compact = document.body.classList.contains("tilt-activo") || avail < 560;
  if(card){
    card.style.maxHeight = Math.round(avail * (compact ? 0.72 : 0.78)) + "px";
  }
  if(foto){
    foto.style.maxHeight = Math.min(compact ? 100 : 150, Math.round(avail * (compact ? 0.15 : 0.20))) + "px";
  }
  if(body){
    body.style.maxHeight = Math.min(compact ? 140 : 200, Math.round(avail * (compact ? 0.22 : 0.28))) + "px";
  }
}

function crearPinEl(h, delay){
  /* wrapper: MapLibre transforma el root; el pin anima adentro (como v14) */
  const root = document.createElement("div");
  root.className = "pin-grupo";
  root.style.cssText = "width:36px;height:36px;cursor:pointer;overflow:visible;";
  const el = document.createElement("div");
  el.className = "pinIcono";
  el.id = "pin-" + h.id;
  el.style.setProperty("--delay", delay);
  el.innerHTML = `<span class="pin-radar" aria-hidden="true"></span>
    <span class="pin-flat">${CORAZON_SVG}</span>
    ${CORAZON_3D}`;
  const fly = document.createElement("div");
  fly.className = "pin-info-fly";
  const info = document.createElement("button");
  info.type = "button";
  info.className = "pin-info";
  info.setAttribute("aria-label", `Ver información de ${h.nombre}`);
  info.title = "Ver información";
  const ico = (typeof HITO_ICONOS !== "undefined" && HITO_ICONOS[h.id])
    ? HITO_ICONOS[h.id]
    : `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="10" fill="currentColor" stroke="none"/></svg>`;
  info.innerHTML = ico;
  fly.appendChild(info);
  root.appendChild(el);
  root.appendChild(fly);
  /* corazón: solo zoom / enfoque */
  el.addEventListener("click", e=>{
    e.stopPropagation();
    if(trazadoActivo) return;
    volarAHito(h);
  });
  /* puntito: abre el popup */
  info.addEventListener("click", e=>{
    e.stopPropagation();
    if(trazadoActivo) return;
    abrirPopupHito(h);
  });
  return root;
}

function renderHitos(){
  Object.values(marcadores).forEach(m=>{ try{ m.remove(); }catch(_){} });
  marcadores = {};
  HITOS.forEach((h,i)=>{
    const delay = (i * 0.38).toFixed(2) + "s";
    const el = crearPinEl(h, delay);
    const marker = new maplibregl.Marker({ element: el, anchor: "center" })
      .setLngLat(aLngLat(geoHito(h)))

function prepararIconoTrazo(btn){
  if(!btn) return;
  btn.querySelectorAll("svg *").forEach(el=>{
    if(typeof el.getTotalLength === "function"){
      let len; try{ len = el.getTotalLength(); }catch(_){ len = 0; }
      if(len >= 1){
        el.style.transition = "none";
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
      }
    }
    const fill = el.getAttribute("fill");
    if(fill && fill !== "none"){
      el.style.transition = "none";
      el.style.opacity = "0";
    }
  });
  void btn.offsetWidth;
}
function animarIconoTrazo(btn){
  if(!btn || matchMedia("(prefers-reduced-motion: reduce)").matches){
    if(btn){
      btn.querySelectorAll("svg *").forEach(el=>{
        el.style.strokeDashoffset = "0";
        el.style.opacity = "";
        el.style.transition = "none";
      });
    }
    return;
  }
  btn.querySelectorAll("svg *").forEach((el,i)=>{
    const delay = i * 45;
    if(typeof el.getTotalLength === "function"){
      let len; try{ len = el.getTotalLength(); }catch(_){ len = 0; }
      if(len >= 1){
        el.style.transition = `stroke-dashoffset .75s ease ${delay}ms`;
        el.style.strokeDashoffset = "0";
      }
    }
    const fill = el.getAttribute("fill");
    if(fill && fill !== "none"){
      el.style.transition = `opacity .35s ease ${delay + 220}ms`;
      el.style.opacity = "1";
    }
  });
}
function armarSalidaPuntito(root){
  const fly = root && root.querySelector(".pin-info-fly");
  if(!fly) return;
  const info = fly.querySelector(".pin-info");
  fly.classList.remove("rebote");
  /* primero ocultar trazos: no mostrar el ícono completo antes de dibujar */
  prepararIconoTrazo(info);
  fly.style.animation = "none";
  void fly.offsetWidth;
  fly.style.animation = "";
  /* dibujar en paralelo con la salida (no después) */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=> animarIconoTrazo(info));
  });
  const finish = ()=>{
    fly.classList.add("rebote");
  };
  const onEnd = (ev)=>{
    if(ev.target !== fly) return;
    if(ev.animationName && ev.animationName !== "pinInfoFlyOut") return;
    finish();
    fly.removeEventListener("animationend", onEnd);
  };
  fly.addEventListener("animationend", onEnd);
  clearTimeout(fly._reboteT);
  fly._reboteT = setTimeout(()=>{
    if(root.classList.contains("activo-sel")) finish();
  }, 680);
}

function camaraHaciaHito(h, opts){
  const forPopup = !!(opts && opts.popup) || S.estado === "POPUP";
  const center = aLngLat(geoHito(h));
  S._popupLl = center;
  const zMax = CFG.zoomHito || 15.25;
  const zNow = map.getZoom();
  const zTarget = zNow < zMax - 0.35
    ? Math.min(zMax, zNow + Math.max(0.85, (zMax - zNow) * 0.55))
    : Math.min(map.getMaxZoom(), Math.max(zNow, zMax));
  const keep3d = !forPopup && (modo3D || map.getPitch() > 8);
  const hView = map.getContainer().clientHeight || 800;
  const needZoom = Math.abs(zTarget - zNow) > 0.08;
  const dur = needZoom ? 820 : 640;
  document.documentElement.style.setProperty("--pop-dur", (dur / 1000).toFixed(2) + "s");
  map.stop();
  const yOff = forPopup
    ? Math.round(Math.min(hView * 0.30, Math.max(hView * 0.22, 140)))
    : Math.round(Math.min(hView * 0.16, Math.max(hView * 0.10, 70)));
  const padding = forPopup
    ? { top: Math.round(hView * 0.08), bottom: Math.round(hView * 0.34), left: 24, right: 24 }
    : { top:0, bottom:0, left:0, right:0 };
  map.easeTo({
    center,
    zoom: zTarget,
    pitch: forPopup ? 0 : (keep3d ? map.getPitch() : 0),
    bearing: map.getBearing(),
    offset: [0, yOff],
    padding,
    duration: dur,
    easing: easeOutCubic,
    essential: true
  });
  return { center, dur };
}

/* tap corto en el wrap: cierra popup / deselecciona aunque MapLibre no dispare click */
(function bindTapVolverAlMapa(){
  const wrap = document.getElementById("mapaWrap");
  if(!wrap) return;
  let tap = null;
  wrap.addEventListener("pointerdown", e=>{
    if(e.pointerType === "mouse" && e.button !== 0) return;
    if(e.target && e.target.closest && e.target.closest(".hito-fixed-card, .maplibregl-popup, .pinIcono, .pin-info, .pin-grupo, button, a, #zoomCtrl, #btnInclinar, #btnTema, #temaPanel")){
      tap = null; return;
    }
    tap = { x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId };
  }, {passive:true});
  const end = e=>{
    if(!tap || tap.id !== e.pointerId) return;
    const dt = performance.now() - tap.t;
    const dx = Math.abs(e.clientX - tap.x);
    const dy = Math.abs(e.clientY - tap.y);
    tap = null;
    if(dt > 420 || dx > 14 || dy > 14) return;
    if(S.estado === "POPUP"){
      if(performance.now() < (S._popupLockHasta || 0)) return;
      salirDePopup();
    }else if(S.estado === "MAPA" && document.querySelector(".pin-grupo.activo-sel")){
      marcarActivo(null);
    }
  };
  wrap.addEventListener("pointerup", end, {passive:true});
  wrap.addEventListener("pointercancel", ()=>{ tap = null; }, {passive:true});
})();

/* caminata delante del tip: izquierda/derecha de a una; se apagan al llegar la línea */
function actualizarHuellasTrazado(metros){
  if(!map || !map.getSource("huellas-trazado")) return;
  if(!LARGO_TOTAL || LARGO_TOTAL < 1) return;
  const paso = CFG.trazadoPasoHuellaM || 48;
  const a0 = CFG.trazadoHuellaAheadMinM || 28;
  const fadeM = CFG.trazadoHuellaFadeM || 22;
  const now = performance.now();
  if(huellasWalk.nextM == null){
    huellasWalk.nextM = metros + a0;
    huellasWalk.stepI = 0;
    huellasWalk.steps = [];
  }
  /* una pisada nueva al avanzar; deja 1–2 adelante (par caminando) */
  while(huellasWalk.nextM <= metros + a0 + paso * 1.05 && huellasWalk.nextM < LARGO_TOTAL - 0.5){
    const m = huellasWalk.nextM;
    const {latlng, rumbo} = puntoEn(m);
    const flip = (huellasWalk.stepI % 2 === 1) ? 1 : 0;
    huellasWalk.steps.push({
      m, rumbo, flip,
      born: now,
      coords: aLngLat(latlng)
    });
    huellasWalk.stepI++;
    huellasWalk.nextM += paso;
  }
  const popMs = 240;
  const feats = [];
  const keep = [];
  for(const s of huellasWalk.steps){
    const ahead = s.m - metros;
    if(ahead < -10) continue;
    let op = 0.95;
    const age = now - s.born;
    const pop = Math.min(1, age / popMs);
    if(age < popMs) op *= 0.25 + 0.75 * pop;
    if(ahead < fadeM){
      op *= Math.max(0, (ahead - 2) / Math.max(1, fadeM - 2));
    }
    if(op < 0.03) continue;
    keep.push(s);
    feats.push({
      type: "Feature",
      properties: {
        rumbo: s.rumbo,
        flip: s.flip,
        opacity: Math.round(op * 100) / 100,
        pop: Math.round(pop * 100) / 100
      },
      geometry: { type: "Point", coordinates: s.coords }
    });
  }
  huellasWalk.steps = keep;
  try{
    map.getSource("huellas-trazado").setData({
      type: "FeatureCollection",
      features: feats
    });
  }catch(_){}
}

  if(screen.orientation && typeof screen.orientation.angle === "number"){
    return screen.orientation.angle;
  }
  if(typeof window.orientation === "number") return window.orientation;
  return 0;
}
function clampTilt(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerpTilt(a,b,t){ return a + (b-a)*t; }
/* respuesta suave: zona muerta + curva (fino cerca de 0) */
function softGyroAxis(deltaDeg){
  const dead = tilt.deadGyro;
  const sens = tilt.sensGyro;
  const a = Math.abs(deltaDeg);
  if(a <= dead) return 0;
  const u = clampTilt((a - dead) / Math.max(1, sens - dead), 0, 1);
  return Math.sign(deltaDeg) * Math.pow(u, 1.45);
}
function aplicarTiltVars(){
  mapaWrapTilt.style.setProperty("--tilt-rx", "0deg");
  mapaWrapTilt.style.setProperty("--tilt-ry", "0deg");
  mapaWrapTilt.style.setProperty("--tilt-x", "0px");
  mapaWrapTilt.style.setProperty("--tilt-y", "0px");
}
function aplanarCamaraTilt(){
  tilt.target = {rx:0, ry:0, x:0, y:0};
  tilt.cur = {rx:0, ry:0, x:0, y:0};
  tilt.pitchAnchor = 0;
  tilt.bearingAnchor = 0;
  aplicarTiltVars();
  if(map && !respaldoRaster){
    try{
      map.setPitch(0);
      map.setBearing(0);
    }catch(_){}
  }
}
function pausarTiltPorPopup(pausar){
  if(!tilt.on) return;
  if(pausar){
    /* guardar inclinación real (ancla + cámara) antes de aplanar */
    let p = tilt.pitchAnchor || 0;
    let b = tilt.bearingAnchor || 0;
    if(map){
      try{
        p = map.getPitch();
        b = map.getBearing();
      }catch(_){}
    }
    tilt._popupPitch = p;
    tilt._popupBearing = b;
    tilt.paused = true;
    resetTiltTargets();
    aplanarCamaraTilt();
    return;
  }
  /* al cerrar popup: volver a la inclinación previa y recalibrar al celu ahora */
  tilt.paused = false;
  const p = clampTilt(tilt._popupPitch != null ? tilt._popupPitch : 0, 0, tilt.maxPitchCam);
  const b = clampTilt(tilt._popupBearing != null ? tilt._popupBearing : 0, -tilt.maxBearingCam, tilt.maxBearingCam);
  tilt.pitchAnchor = p;
  tilt.bearingAnchor = b;
  tilt.target = {rx:0, ry:0, x:0, y:0};
  tilt.cur = {rx:0, ry:0, x:0, y:0};
  tilt.baseBeta = null;
  tilt.baseGamma = null;
  tilt.lockAplanar = false;
  tilt.inputLockHasta = performance.now() + 220;
  aplicarTiltVars();
  if(map && !respaldoRaster){
    try{
      map.setPitch(p);
      map.setBearing(b);
    }catch(_){}
  }
  asegurarLoopTilt();
}
function aplicarCamaraDesdeTilt(){
  if(!map || respaldoRaster) return;
  if(!tilt.on || tilt.paused || tilt.holding || S.estado === "POPUP") return;
  /* no pelear con pan/zoom/rotate del usuario */
  try{
    if(map.isMoving && map.isMoving()) return;
    if(map.dragPan && map.dragPan.isActive && map.dragPan.isActive()) return;
  }catch(_){}
  if(tiltInputBloqueado()){
    /* solo forzar plano en el lock inicial; tras pan/zoom mantener la inclinación */
    if(tilt.lockAplanar){
      if(map.getPitch() > 0.2 || Math.abs(map.getBearing()) > 0.2){
        try{ map.setPitch(0); map.setBearing(0); }catch(_){}
      }
    }
    return;
  }
  const nx = tilt.cur.ry / tilt.maxDeg;
  const ny = -tilt.cur.rx / tilt.maxDeg;
  /* ancla + delta: al soltar el dedo no salta; el gyro suma desde ahí */
  const pitch = clampTilt(tilt.pitchAnchor + (-ny) * tilt.maxPitchCam, 0, tilt.maxPitchCam);
  const bearing = clampTilt(tilt.bearingAnchor + nx * tilt.maxBearingCam, -tilt.maxBearingCam, tilt.maxBearingCam);
  const dp = Math.abs(map.getPitch() - pitch);
  const db = Math.abs(((map.getBearing() - bearing + 540) % 360) - 180);
  if(dp < 0.12 && db < 0.12) return;
  try{
    map.setPitch(pitch);
    map.setBearing(bearing);
  }catch(_){}
}
function resetTiltTargets(){
  tilt.target = {rx:0, ry:0, x:0, y:0};
  tilt.baseBeta = null;
  tilt.baseGamma = null;
}
function setTiltFromAxes(nx, ny){
  if(tiltInputBloqueado() || tilt.holding) return;
  tilt.target.rx = clampTilt(-ny, -1, 1) * tilt.maxDeg;
  tilt.target.ry = clampTilt(nx, -1, 1) * tilt.maxDeg;
  tilt.target.x = clampTilt(nx, -1, 1) * tilt.maxShift;
  tilt.target.y = clampTilt(-ny, -1, 1) * tilt.maxShift * 0.45;
  asegurarLoopTilt();
}
function loopTilt(){
  const t = esMobileTilt() ? 0.14 : 0.18; /* mobile más suave / menos nervioso */
  tilt.cur.rx = lerpTilt(tilt.cur.rx, tilt.target.rx, t);
  tilt.cur.ry = lerpTilt(tilt.cur.ry, tilt.target.ry, t);
  tilt.cur.x  = lerpTilt(tilt.cur.x,  tilt.target.x,  t);
  tilt.cur.y  = lerpTilt(tilt.cur.y,  tilt.target.y,  t);
  aplicarTiltVars();
  aplicarCamaraDesdeTilt();
  if(!tilt.on){
    const quiet =
      Math.abs(tilt.cur.rx - tilt.target.rx) < 0.03 &&
      Math.abs(tilt.cur.ry - tilt.target.ry) < 0.03 &&
      Math.abs(tilt.cur.rx) < 0.03 && Math.abs(tilt.cur.ry) < 0.03;
    if(quiet){
      tilt.raf = 0;
      aplicarTiltVars();
      return;
    }
  }
  tilt.raf = requestAnimationFrame(loopTilt);
}
function asegurarLoopTilt(){
  if(!tilt.raf) tilt.raf = requestAnimationFrame(loopTilt);
}
function onOrientacion(e){
  if(!tilt.on || tilt.paused || tilt.holding || S.estado === "POPUP") return;
  const beta = e.beta, gamma = e.gamma;
  if(beta == null || gamma == null) return;
  tilt.gyroOk = true;
  if(tiltInputBloqueado()){
    tilt.baseBeta = beta;
    tilt.baseGamma = gamma;
    return;
  }
  if(tilt.baseBeta == null || tilt.baseGamma == null){
    tilt.baseBeta = beta;
    tilt.baseGamma = gamma;
    return;
  }
  const dBeta = beta - tilt.baseBeta;
  const dGamma = gamma - tilt.baseGamma;
  let nx = softGyroAxis(dGamma);
  let ny = softGyroAxis(dBeta);
  const ang = ((anguloPantalla() % 360) + 360) % 360;
  const rad = ang * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const rx = nx * cos - ny * sin;
  const ry = nx * sin + ny * cos;
  setTiltFromAxes(clampTilt(rx, -1, 1), clampTilt(ry, -1, 1));
}
function setTiltFromClientPoint(clientX, clientY){
  if(tiltInputBloqueado() || tilt.holding) return;
  const r = mapaWrapTilt.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const g = tilt.mouseGain || 1.28;
  const nx = ((clientX - r.left) / r.width - 0.5) * 2 * g;
  const ny = ((clientY - r.top) / r.height - 0.5) * 2 * g;
  /* no pisar anclas: tras pan/drag el hover suma desde la pose actual */
  setTiltFromAxes(clampTilt(nx, -1, 1), clampTilt(ny, -1, 1));
}
function onPointerTiltHover(e){
  if(!tilt.on || tilt.paused || tilt.holding || S.estado === "POPUP") return;
  if(esMobileTilt()) return;
  if(e.pointerType === "touch" || e.pointerType === "pen") return;
  if(e.buttons !== 0) return;
  if(e.target.closest("button, a, .maplibregl-popup, .maplibregl-ctrl, #temaPanel, #zoomCtrl")) return;
  setTiltFromClientPoint(e.clientX, e.clientY);
}
function liberarTiltTrasGestoMapa(){
  const n = tilt.holdPtrs ? tilt.holdPtrs.size : 0;
  if(n > 0) return;
  if(!tilt.on){ tilt.holding = false; return; }
  if(map){
    try{
      tilt.pitchAnchor = map.getPitch();
      tilt.bearingAnchor = map.getBearing();
    }catch(_){}
  }
  tilt.target = {rx:0, ry:0, x:0, y:0};
  tilt.cur = {rx:0, ry:0, x:0, y:0};
  tilt.baseBeta = null;
  tilt.baseGamma = null;
  tilt.holding = false;
  tilt.lockAplanar = false;
  tilt.inputLockHasta = performance.now() + 120;
  asegurarLoopTilt();
}
/* al agarrar el mapa (mouse o dedo): congelar inclinación para poder navegar */
function onTiltTouchStart(e){
  if(!tilt.on || tilt.paused || S.estado === "POPUP") return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  if(e.target.closest("button, a, #temaPanel, #zoomCtrl, #btnInclinar, #btnTema, .maplibregl-ctrl, .maplibregl-popup, .hito-fixed-card")) return;
  if(!tilt.holdPtrs) tilt.holdPtrs = new Set();
  tilt.holdPtrs.add(e.pointerId);
  tilt.holding = true;
}
function onTiltTouchEnd(e){
  if(!tilt.holdPtrs || !tilt.holdPtrs.size){
    if(tilt.holding) liberarTiltTrasGestoMapa();
    return;
  }
  if(e && e.pointerId != null) tilt.holdPtrs.delete(e.pointerId);
  /* si el mouse soltó el botón primario, limpiar leftovers */
  if(e && e.pointerType === "mouse" && e.buttons === 0) tilt.holdPtrs.clear();
  liberarTiltTrasGestoMapa();
}
function onTiltHoldSafety(e){
  /* suelta fuera del wrap / cancel: no dejar holding trabado */
  if(!tilt.holding && !(tilt.holdPtrs && tilt.holdPtrs.size)) return;
  if(e && e.pointerType === "mouse" && e.buttons !== 0) return;
  if(tilt.holdPtrs && e && e.pointerId != null) tilt.holdPtrs.delete(e.pointerId);
  if(e && e.pointerType === "mouse" && e.buttons === 0 && tilt.holdPtrs) tilt.holdPtrs.clear();
  liberarTiltTrasGestoMapa();
}
async function pedirPermisoOrientacion(){
  try{
    if(typeof DeviceMotionEvent !== "undefined" &&
       typeof DeviceMotionEvent.requestPermission === "function"){
      try{ await DeviceMotionEvent.requestPermission(); }catch(_){}
    }
    if(typeof DeviceOrientationEvent !== "undefined" &&
       typeof DeviceOrientationEvent.requestPermission === "function"){
      const res = await DeviceOrientationEvent.requestPermission();
      tilt.permiso = (res === "granted");
      return tilt.permiso;
    }
    tilt.permiso = typeof DeviceOrientationEvent !== "undefined";
    return tilt.permiso;
  }catch(_){
    tilt.permiso = false;
    return false;
  }
}

function initInclinacion(){

    tilt.baseBeta = null;
    tilt.baseGamma = null;
  });

function llDentroCircuito(ll){

  try{
    const [[minLng,minLat],[maxLng,maxLat]] = BOUNDS_MAX;

  if(yo.firstFix){

function aplicarModoCalles(modo){
  /* completo = todos · medio/simple = calles principales · solo/nada = sin ningún nombre */
  if(!map) return;
  let style;
  try{ style = map.getStyle(); }catch(_){ return; }
  if(!style || !style.layers) return;
  const m = (modo === "simple") ? "medio"
    : (modo === "nada") ? "solo"
    : (modo || "completo");
  const CUSTOM = { huellas: 1, "huellas-trazado": 1 };
  for(const layer of style.layers){
    if(layer.type !== "symbol") continue;
    const id = layer.id;
    if(CUSTOM[id]) continue;
    const sl = layer["source-layer"] || "";
    const isPoi = sl === "poi" || /^poi[_-]/i.test(id) || id === "airport";
    const isCalle = sl === "transportation_name"
      || /highway-name|highway-shield|road_shield|road_label|street.?name/i.test(id);
    const isLugar = sl === "place"
      || /place_|label_place|settlement|suburb|neighbourhood|neighborhood|city|town|village|state|country/i.test(id);
    const isAgua = sl === "water_name" || sl === "waterway"
      || /water.?name|waterway|lake|river|stream|arroyo/i.test(id);
    const isOtro = sl === "housenumber" || sl === "park" || sl === "mountain_peak"
      || /housenumber|park.?label|mountain|peak|aerodrome|building.?name/i.test(id);
    const hasText = !!(layer.layout && layer.layout["text-field"] != null);
    const isLabel = isCalle || isLugar || isAgua || isOtro || isPoi || hasText;
    const esMenor = /minor|path/i.test(id);
    const esMayor = /major|shield|motorway|primary|secondary/i.test(id);

    let vis = "visible";
    if(m === "solo"){
      vis = "none";
    }else if(m === "medio"){
      if(isPoi || isLugar || isAgua || isOtro || (!isCalle && isLabel)){
        vis = "none";
      }else if(isCalle){
        /* principales + shields; sin callecitas/path */
        vis = esMenor ? "none" : "visible";
      }
    }else{
      /* completo: nombres sí, POIs de íconos no */
      vis = isPoi ? "none" : "visible";
    }
    try{ map.setLayoutProperty(id, "visibility", vis); }catch(_){}
    if(vis !== "visible") continue;
    if(!isCalle && !(m === "completo" && (isLugar || isAgua))) continue;

    /* no tocar text-font: OpenFreeMap solo tiene Noto Sans Regular/Italic */
    if(m === "completo"){
      if(isCalle){
        try{
          map.setLayerZoomRange(
            id,
            esMenor ? 13.2 : 11.2,
            24
          );
        }catch(_){}
        try{
          map.setLayoutProperty(id, "text-size", [
            "interpolate", ["linear"], ["zoom"],
            11, esMenor ? 12 : 14,
            13, esMenor ? 14 : 17,
            15, esMenor ? 17 : 22,
            17, esMenor ? 20 : 28
          ]);
        }catch(_){}
      }else{
        try{
          map.setLayoutProperty(id, "text-size", [
            "interpolate", ["linear"], ["zoom"],
            11, 12,
            14, 16,
            16, 20
          ]);
        }catch(_){}
      }
      try{ map.setPaintProperty(id, "text-color", "#ffffff"); }catch(_){}
      try{ map.setPaintProperty(id, "text-halo-color", "#000000"); }catch(_){}
      try{ map.setPaintProperty(id, "text-halo-width", isCalle ? 2.8 : 2.2); }catch(_){}
      try{ map.setPaintProperty(id, "text-halo-blur", 0.1); }catch(_){}
      try{ map.setPaintProperty(id, "text-opacity", 1); }catch(_){}
    }else if(isCalle){
      try{
        map.setLayoutProperty(id, "text-size", [
          "interpolate", ["linear"], ["zoom"],
          12, 12,
          14, 15,
          16, 18
        ]);
      }catch(_){}
      try{ map.setPaintProperty(id, "text-color", "#ffffff"); }catch(_){}
      try{ map.setPaintProperty(id, "text-halo-color", "#000000"); }catch(_){}
      try{ map.setPaintProperty(id, "text-halo-width", 2); }catch(_){}
    }
  }
  aplicarModoCalles._actual = m;
}
function aplicarSensInclinacion(){
  if(typeof tilt === "undefined") return;
  const s = Number(temaState?.filters?.tiltSens ?? 7);
  const t = Math.max(0, Math.min(1, (s - 1) / 9));
  /* 1 = suave · 10 = muy sensible (gyro + mouse) */
  tilt.sensGyro = 38 - t * 28;   /* 38° → 10° */
  tilt.deadGyro = 5.5 - t * 3.5; /* 5.5° → 2° */
  tilt.mouseGain = 1.1 + t * 0.55; /* 1.1 → 1.65 */
  tilt.maxPitchCam = 56 + t * 10;  /* 56 → 66 */
  tilt.maxBearingCam = 12 + t * 6; /* 12 → 18 */
}
/* panel: 1 rápida (~28s) · 5 normal (~52s) · 10 lenta (~110s) */
function duracionTrazadoMs(){
  const t = Number(temaState?.filters?.trazadoTempo ?? 5);
  const u = (Math.max(1, Math.min(10, t)) - 1) / 9;
  return Math.round(28000 + u * 82000);
}
/* panel: 1 más reactiva · 5 = como antes · 10 un poco más suave (sin lag) */
function cfgCamaraSuavidad(){
  const s = Number(temaState?.filters?.trazadoSuavidad ?? 5);
  const u = (Math.max(1, Math.min(10, s)) - 1) / 9;
  /* centro en 5 ≈ bearing 0.028 / center 0.038 (valores originales) */
  return {
    bearingLerp: 0.042 - u * 0.024, /* 0.042 → 0.018 */
    centerLerp: 0.055 - u * 0.028   /* 0.055 → 0.027 */
  };
}

function deepMergeTema(base, patch){
  const out = JSON.parse(JSON.stringify(base));
  if(!patch) return out;
  // compat: si viene el formato viejo dia/noche, tomar dia o noche
  const src = patch.colors ? patch : (patch.dia || patch.noche || {});
  if(src.colors) Object.assign(out.colors, src.colors);
  if(src.filters) Object.assign(out.filters, src.filters);
  /* temas viejos: si no hay map-grad, copiar desde sb-grad */
  const c = out.colors;
  if(!c["map-grad-1"] && c["sb-grad-1"]) c["map-grad-1"] = c["sb-grad-1"];
  if(!c["map-grad-2"] && c["sb-grad-2"]) c["map-grad-2"] = c["sb-grad-2"];
  if(!c["map-grad-3"] && c["sb-grad-3"]) c["map-grad-3"] = c["sb-grad-3"];
  if(!c["map-grad-2"]) c["map-grad-2"] = TEMA_DEFAULT.colors["map-grad-2"];
  if(!c["map-grad-3"]) c["map-grad-3"] = TEMA_DEFAULT.colors["map-grad-3"];
  if(!c["map-grad-4"]) c["map-grad-4"] = TEMA_DEFAULT.colors["map-grad-4"];
  if(!c["map-grad-5"]) c["map-grad-5"] = c["map-grad-3"] || TEMA_DEFAULT.colors["map-grad-5"];
  /* mapLook: degrade | natural | satellite */
  const f = out.filters;
  if(f.mapLook !== "degrade" && f.mapLook !== "natural" && f.mapLook !== "satellite"){
    f.mapLook = (f.mapDegrade === false) ? "natural" : "degrade";
  }
  f.mapDegrade = f.mapLook === "degrade";
  /* v74 buggy: suavidad alta trababa la cámara → recentrar a normal */
  if(f.trazadoSuavidad == null) f.trazadoSuavidad = 5;
  else if(Number(f.trazadoSuavidad) > 7) f.trazadoSuavidad = 5;
  if(f.trazadoTempo == null) f.trazadoTempo = 5;
  return out;
}
function cargarTemaGuardado(){
  try{
    const rawV26 = localStorage.getItem(TEMA_KEY);
    const rawOld = localStorage.getItem("totem21k-tema-v25") || localStorage.getItem("totem21k-tema-v21") || localStorage.getItem("totem21k-tema-v20") || localStorage.getItem("totem21k-tema-v19") || localStorage.getItem("totem21k-tema-v18") || localStorage.getItem("totem21k-tema-v17");
    if(rawV26){
      temaState = deepMergeTema(TEMA_DEFAULT, JSON.parse(rawV26));
      return;
    }
    if(!rawOld) return;
    temaState = deepMergeTema(TEMA_DEFAULT, JSON.parse(rawOld));
    /* migración v26: degradé Degrade2 como estándar */
    ["map-grad-1","map-grad-2","map-grad-3","map-grad-4","map-grad-5"].forEach(k=>{
      temaState.colors[k] = TEMA_DEFAULT.colors[k];

    temaState.filters.rutaGrosor = TEMA_DEFAULT.filters.rutaGrosor;
    temaState.filters.tiltSens = TEMA_DEFAULT.filters.tiltSens;
    ["sb-grad-1","sb-grad-2","sb-grad-3"].forEach(k=>{
