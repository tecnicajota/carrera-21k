  fillColorGrid(standby, STANDBY_COLORS);
  colores.innerHTML = "";
  for(const sec of COLOR_SECTIONS){
    const wrap = document.createElement("div");
    wrap.className = "temaSecInner";
    const title = document.createElement("h5");
    title.textContent = sec.title;
    wrap.appendChild(title);
    const gridHost = document.createElement("div");
    wrap.appendChild(gridHost);
    fillColorGrid(gridHost, sec.keys);
    colores.appendChild(wrap);
  }
  filtros.innerHTML = "";
  const look = (typeof modoMapaLook === "function") ? modoMapaLook() : "degrade";
  const lookField = document.createElement("div");
  lookField.className = "temaField";
  lookField.innerHTML = `
    <label>Aspecto del mapa</label>
    <div class="temaSeg" role="radiogroup" aria-label="Aspecto del mapa">
      <label class="${look==="degrade"?"on":""}">
        <input type="radio" name="temaMapLook" data-maplook="1" value="degrade"${look==="degrade"?" checked":""}>
        <span>Degradé<br><small style="font-weight:600;opacity:.7">Filtro BA rosa–naranja</small></span>
      </label>
      <label class="${look==="natural"?"on":""}">
        <input type="radio" name="temaMapLook" data-maplook="1" value="natural"${look==="natural"?" checked":""}>
        <span>Color natural<br><small style="font-weight:600;opacity:.7">Mapa Voyager a color</small></span>
      </label>
      <label class="${look==="satellite"?"on":""}">
        <input type="radio" name="temaMapLook" data-maplook="1" value="satellite"${look==="satellite"?" checked":""}>
        <span>Satélite<br><small style="font-weight:600;opacity:.7">Foto aérea + calles</small></span>
      </label>
    </div>`;
  filtros.appendChild(lookField);
  const callesVal = temaState.filters.calles || "solo";
  const callesField = document.createElement("div");
  callesField.className = "temaField";
  callesField.innerHTML = `
    <label>Nombres del mapa</label>
    <div class="temaSeg" role="radiogroup" aria-label="Nombres del mapa">
      ${CALLES_OPTIONS.map(o => `
        <label class="${o.value===callesVal?"on":""}">
          <input type="radio" name="temaCalles" data-calles="1" value="${o.value}"${o.value===callesVal?" checked":""}>
          <span>${o.label}<br><small style="font-weight:600;opacity:.7">${o.hint}</small></span>
        </label>`).join("")}
    </div>`;
  filtros.appendChild(callesField);
  const blendVal = temaState.filters.blend || "multiply";
  const blendField = document.createElement("div");
  blendField.className = "temaField";
  blendField.innerHTML = `
    <label>Modo de fusión</label>
    <select data-blend="1">
      ${BLEND_OPTIONS.map(o => `<option value="${o.value}"${o.value===blendVal?" selected":""}>${o.label}</option>`).join("")}
    </select>`;
  filtros.appendChild(blendField);
  const filterKeys = ["rutaGrosor", "tiltSens", "trazadoTempo", "trazadoSuavidad", "tinte", "bri", "dark", "con", "sat", "hue"];
  for(const key of filterKeys){
    const meta = FILTER_META[key];
    if(!meta) continue;
    const fallback = key === "rutaGrosor" ? 8.5
      : key === "tiltSens" ? 7
      : key === "trazadoTempo" ? 5
      : key === "trazadoSuavidad" ? 5
      : key === "tinte" ? 0.82
      : key === "dark" ? 0.04
      : key === "hue" ? 339
      : key === "sat" ? 2.5
      : key === "bri" ? 0.99
      : key === "con" ? 1.08
      : 1;
    const val = temaState.filters[key] ?? fallback;
    const field = document.createElement("div");
    field.className = "temaField";
    let hint = "";
    if(key === "tiltSens") hint = ` <small style="font-weight:600;opacity:.65">(1 suave · 10 fuerte)</small>`;
    if(key === "trazadoTempo"){
      const secs = Math.round((28000 + ((Math.max(1, Math.min(10, Number(val))) - 1) / 9) * 82000) / 1000);
      hint = ` <small style="font-weight:600;opacity:.65">(1 rápida · 10 lenta · <span data-tempo-secs>~${secs}s</span>)</small>`;
    }
    if(key === "trazadoSuavidad") hint = ` <small style="font-weight:600;opacity:.65">(5 = normal · 10 más suave)</small>`;
    field.innerHTML = `
      <label>${meta.label}${hint} <span class="temaVal" data-fval="${key}">${val}</span></label>
      <input type="range" data-filter="${key}" min="${meta.min}" max="${meta.max}" step="${meta.step}" value="${val}">`;
    filtros.appendChild(field);
  }
}
function abrirPanelTema(si){
  const panel = document.getElementById("temaPanel");
  const btn = document.getElementById("btnTema");
  const open = !!si;
  panel.classList.toggle("abierto", open);
  panel.setAttribute("aria-hidden", open ? "false" : "true");
  btn.classList.toggle("activo", open);
  btn.setAttribute("aria-pressed", open ? "true" : "false");
  if(open){
    renderPanelTema();
    clearTimeout(S.tInactividad);
  }else{
    reiniciarInactividad();
  }
}
function initPanelTema(){
  cargarTemaGuardado();
  aplicarTemaLive();
  const panel = document.getElementById("temaPanel");
  document.getElementById("btnTema").addEventListener("click", e=>{
    e.stopPropagation();
    abrirPanelTema(!panel.classList.contains("abierto"));
  });
  document.getElementById("temaCerrar").addEventListener("click", e=>{
    e.stopPropagation();
    abrirPanelTema(false);
  });
  panel.addEventListener("pointerdown", e=>{
    if(e.target === panel) abrirPanelTema(false);
  });
  function onTemaColorInput(e){
    const t = e.target;
    if(t.dataset.color){
      temaState.colors[t.dataset.color] = t.value;
      const text = document.querySelector(`[data-color-text="${t.dataset.color}"]`);
      if(text) text.value = t.value;
      aplicarTemaLive();
    }
    if(t.dataset.colorText){
      const v = t.value.trim();
      if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v) || /^rgba?\(/.test(v)){
        temaState.colors[t.dataset.colorText] = v;
        const pick = document.querySelector(`[data-color="${t.dataset.colorText}"]`);
        if(pick && /^#([0-9a-fA-F]{6})$/.test(v)) pick.value = v;
        aplicarTemaLive();
      }
    }
  }
  document.getElementById("temaStandby").addEventListener("input", onTemaColorInput);
  document.getElementById("temaColores").addEventListener("input", onTemaColorInput);
  document.getElementById("temaFiltros").addEventListener("input", e=>{
    const t = e.target;
    if(t.dataset.maplook){
      setModoMapaLook(t.value);
      document.querySelectorAll('#temaFiltros input[data-maplook]').forEach(inp=>{
        const lab = inp.closest("label");
        if(lab) lab.classList.toggle("on", inp.checked);
      });
      aplicarTemaLive();
      return;
    }
    if(t.dataset.degrade){
      setModoMapaLook(t.value === "off" ? "natural" : "degrade");
      aplicarTemaLive();
      return;
    }
    if(t.dataset.blend){
      temaState.filters.blend = t.value;
      aplicarTemaLive();
      return;
    }
    if(t.dataset.calles){
      temaState.filters.calles = t.value;
      document.querySelectorAll("#temaFiltros .temaSeg label").forEach(lab=>{
        const inp = lab.querySelector("input");
        if(inp && inp.name === "temaCalles") lab.classList.toggle("on", inp.value === t.value);
      });
      aplicarTemaLive();
      return;
    }
    if(!t.dataset.filter) return;
    const key = t.dataset.filter;
    const num = Number(t.value);
    temaState.filters[key] = num;
    const lab = document.querySelector(`[data-fval="${key}"]`);
    if(lab) lab.textContent = String(num);
    if(key === "trazadoTempo"){
      const secs = Math.round(duracionTrazadoMs() / 1000);
      const secEl = document.querySelector("[data-tempo-secs]");
      if(secEl) secEl.textContent = `~${secs}s`;
    }
    aplicarTemaLive();
  });
  document.getElementById("temaFiltros").addEventListener("change", e=>{
    const t = e.target;
    if(t.dataset.maplook){
      setModoMapaLook(t.value);
      document.querySelectorAll('#temaFiltros input[data-maplook]').forEach(inp=>{
        const lab = inp.closest("label");
        if(lab) lab.classList.toggle("on", inp.checked);
      });
      aplicarTemaLive();
      return;
    }
    if(t.dataset.degrade){
      setModoMapaLook(t.value === "off" ? "natural" : "degrade");
      aplicarTemaLive();
      return;
    }
    if(t.dataset.calles){
      temaState.filters.calles = t.value;
      document.querySelectorAll("#temaFiltros .temaSeg label").forEach(lab=>{
        const inp = lab.querySelector("input");
        if(inp && inp.name === "temaCalles") lab.classList.toggle("on", inp.value === t.value);
      });
      aplicarTemaLive();
      return;
    }
    if(!t.dataset.blend) return;
    temaState.filters.blend = t.value;
    aplicarTemaLive();
  });
  document.getElementById("temaGuardar").addEventListener("click", e=>{
    e.stopPropagation();
    localStorage.setItem(TEMA_KEY, JSON.stringify(temaState));
    temaMsg("Guardado en este dispositivo ✓");
  });
  document.getElementById("temaReset").addEventListener("click", e=>{
    e.stopPropagation();
    temaState = JSON.parse(JSON.stringify(TEMA_DEFAULT));
    aplicarTemaLive();
    renderPanelTema();
    temaMsg("Valores de fábrica (sin guardar todavía)");
  });
  document.getElementById("temaExport").addEventListener("click", e=>{
    e.stopPropagation();
    const blob = new Blob([JSON.stringify(temaState, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "totem-21k-tema.json";
    a.click();
    URL.revokeObjectURL(a.href);
    temaMsg("JSON exportado");
  });
  document.getElementById("temaImport").addEventListener("click", e=>{
    e.stopPropagation();
    document.getElementById("temaFile").click();
  });
  document.getElementById("temaFile").addEventListener("change", async e=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      temaState = deepMergeTema(TEMA_DEFAULT, data);
      aplicarTemaLive();
      renderPanelTema();
      temaMsg("Importado (tocá Guardar para fijarlo)");
    }catch(_){
      temaMsg("No se pudo leer el JSON");
    }
  });
  ["pointerdown","pointermove","keydown"].forEach(ev=>{
    document.getElementById("temaCard").addEventListener(ev, e=>{
      e.stopPropagation();
      clearTimeout(S.tInactividad);
    }, {passive:true});
  });
}
initPanelTema();
irA("ATTRACT");
</script>
